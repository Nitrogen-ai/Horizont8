<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizont:8 · Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="stylesheet" href="assets/base.css">
<style>
  :root { --bg: #eef0f3; --card: #fff; --line: #dfe3e8; --chip: #eef1f5; --accent: #3b5bdb; }
  html, body { height: 100%; overflow: hidden; }
  #top { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 50; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
  #top > * { pointer-events: auto; }
  .pill { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 14px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 900; font-size: 1.15em; letter-spacing: -.02em; } .brand span { color: #e8604c; }
  .brand small { font-weight: 500; color: var(--muted); font-size: .7em; margin-left: 6px; }
  #jump { display: flex; gap: 4px; flex-wrap: wrap; }
  #jump button { border: 0; border-radius: 8px; padding: 4px 9px; cursor: pointer; background: var(--chip); font-weight: 700; font-size: .8em; }
  #jump button i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--cc); margin-right: 5px; }
  #zoom { position: fixed; right: 14px; bottom: 14px; z-index: 50; }
  #zoom button { border: 0; background: none; font-size: 1.2em; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; }
  #zoom button:hover { background: var(--chip); } #zoom span { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-size: .85em; }
  #hint { position: fixed; left: 14px; bottom: 14px; z-index: 50; font-size: .8em; color: var(--muted); }
  #side { position: fixed; right: 14px; top: 76px; width: 340px; max-height: calc(100vh - 150px); overflow: auto; z-index: 40; display: none; }
  #side.open { display: block; } #side h2 { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 10px; }
  #vp { position: fixed; inset: 0; cursor: grab; background-image: radial-gradient(#c5cbd3 1.1px, transparent 1.2px); background-size: 24px 24px; }
  #vp.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 4200px; display: flex; flex-wrap: wrap; gap: 90px; padding: 160px 120px 300px; align-items: flex-start; }
  .frame { background: rgba(255,255,255,.55); border: 2px solid var(--cc); border-radius: 22px; padding: 26px 28px 30px; position: relative; }
  .frame > h2 { margin: 0; font-size: 2.6em; letter-spacing: -.03em; line-height: 1.05; display: flex; gap: 14px; align-items: center; }
  .frame > h2 .k { background: var(--cc); color: #fff; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-size: .6em; flex: none; }
  .frame > .sub { color: var(--muted); margin: 8px 0 20px; max-width: 900px; font-size: 1.05em; }
  .tiles { columns: var(--cols) 330px; column-gap: 18px; }
  .tile { break-inside: avoid; margin-bottom: 18px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; border-left: 6px solid var(--cc); cursor: default; }
  .tile .kick { font-size: .72em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
  .tile h3 { margin: 2px 0 6px; font-size: 1.15em; }
  .frame.vote .tile h3 { font-size: 1.7em; letter-spacing: -.02em; }
  .frame.vote .tile { border-left-width: 10px; }
  .fs { position: absolute; width: 210px; min-height: 150px; background: var(--nc); box-shadow: 0 8px 18px rgba(0,0,0,.18); border-radius: 3px; padding: 0 12px 12px; z-index: 5; font-size: 1.05em; }
  .fs header { display: flex; justify-content: space-between; font-size: .7em; padding: 6px 0; cursor: move; opacity: .75; user-select: none; }
  .fs header button { border: 0; background: none; cursor: pointer; font-size: 1.4em; line-height: .8; }
  .fs .txt { outline: none; min-height: 100px; white-space: pre-wrap; word-break: break-word; }
  @media print { #top, #zoom, #hint, #side { display: none; } }
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>
<div id="top">
  <div class="pill"><span class="brand">HORIZONT<span>:</span>8<small id="meta"></small></span></div>
  <div class="pill" id="tb"></div>
  <div class="pill" id="jump"></div>
  <div class="pill"><button class="h8-mini" id="toggleSide">Beschlüsse & Agenda ▸</button></div>
</div>
<div id="side" class="pill" style="display:none;flex-direction:column;align-items:stretch"></div>
<div id="zoom" class="pill"><button id="zo" title="Verkleinern">−</button><span id="zv">100%</span><button id="zi" title="Vergrößern">＋</button><button id="zf" title="Alles zeigen">⤢</button></div>
<div id="hint" class="pill">Ziehen = verschieben · Strg/⌘ + Mausrad = Zoom · Doppelklick auf freie Fläche = Haftnotiz</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const H = H8, D = H.data;
  const vp = document.getElementById("vp"), world = document.getElementById("world");
  const VIEW = "h8-board-view";
  let view = JSON.parse(sessionStorage.getItem(VIEW) || "null") || { x: 0, y: 0, z: .55 };
  document.getElementById("meta").textContent = D.meta.termin;
  const css = (c) => `var(--c-${c.farbe})`;

  function apply() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; document.getElementById("zv").textContent = Math.round(view.z * 100) + "%"; sessionStorage.setItem(VIEW, JSON.stringify(view)); }
  function zoomAt(f, cx, cy) {
    const nz = Math.min(2.2, Math.max(.15, view.z * f));
    view.x = cx - (cx - view.x) * (nz / view.z); view.y = cy - (cy - view.y) * (nz / view.z); view.z = nz; apply();
  }
  function unionRect() {
    const rs = [...world.querySelectorAll(".frame")].map((f) => f.getBoundingClientRect());
    const l = Math.min(...rs.map((r) => r.left)), t = Math.min(...rs.map((r) => r.top));
    const r = Math.max(...rs.map((x) => x.right)), b = Math.max(...rs.map((x) => x.bottom));
    return { left: l, top: t, width: r - l, height: b - t };
  }
  function fit(elm) {
    const r = elm === world ? unionRect() : elm.getBoundingClientRect(), w = innerWidth, h = innerHeight - 90;
    const wx = (r.left - view.x) / view.z, wy = (r.top - view.y) / view.z, ww = r.width / view.z, wh = r.height / view.z;
    const z = Math.min(1.1, Math.min((w - 60) / ww, (h - 40) / wh));
    view.z = z; view.x = (w - ww * z) / 2 - wx * z; view.y = 90 + Math.max(10, (h - wh * z) / 2) - wy * z; apply();
  }

  function drawWorld() {
    world.innerHTML = "";
    H.clusters().forEach((c) => {
      const cols = Math.min(4, Math.max(2, c.tiles.length > 4 ? 4 : c.tiles.length));
      const f = H.el(`<section class="frame ${c.voting ? "vote" : ""}" id="f-${c.id}" style="--cc:${css(c)};--cols:${cols};width:${cols * 348 + 56}px"><h2><span class="k">${c.kurz}</span>${H.esc(c.titel)}</h2><p class="sub">${c.sub || ""}</p><div class="tiles"></div></section>`);
      const box = f.querySelector(".tiles");
      c.tiles.forEach((t) => {
        const tile = H.el(`<article class="tile"><div class="kick">${H.esc(t.kicker || "")}</div><h3>${H.esc(t.titel)}</h3>${H.tileBody(t)}</article>`);
        if (c.voting && !/kombi/.test(t.id)) tile.appendChild(H.voteEl(t.id));
        tile.appendChild(H.notesEl(t.id)); box.appendChild(tile);
      });
      f.appendChild(H.addTileEl(c.id));
      world.appendChild(f);
    });
    (H.st.free || []).forEach(drawFree);
  }
  function drawFree(n) {
    const s = H.el(`<div class="fs" style="left:${n.x}px;top:${n.y}px;--nc:${H.colorOf(n.author)}"><header><span>${H.esc(n.author)}</span><button title="Haftnotiz löschen">×</button></header><div class="txt" contenteditable="true">${H.esc(n.text)}</div></div>`);
    s.querySelector("button").addEventListener("click", () => { H.st.free = H.st.free.filter((x) => x.id !== n.id); H.save(); s.remove(); });
    s.querySelector(".txt").addEventListener("input", (e) => { n.text = e.target.innerText; H.save(); });
    const hd = s.querySelector("header");
    hd.addEventListener("pointerdown", (e) => {
      if (e.target.tagName === "BUTTON") return;
      e.stopPropagation(); hd.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
      const mv = (ev) => { n.x = ox + (ev.clientX - sx) / view.z; n.y = oy + (ev.clientY - sy) / view.z; s.style.left = n.x + "px"; s.style.top = n.y + "px"; };
      const up = () => { hd.removeEventListener("pointermove", mv); hd.removeEventListener("pointerup", up); H.save(); };
      hd.addEventListener("pointermove", mv); hd.addEventListener("pointerup", up);
    });
    world.appendChild(s); return s;
  }
  const blocked = (t) => t.closest(".tile, .fs, input, textarea, button, a, select, video, form, [contenteditable]");
  vp.addEventListener("pointerdown", (e) => {
    if (blocked(e.target)) return;
    vp.classList.add("drag"); vp.setPointerCapture(e.pointerId);
    const sx = e.clientX - view.x, sy = e.clientY - view.y;
    const mv = (ev) => { view.x = ev.clientX - sx; view.y = ev.clientY - sy; apply(); };
    const up = () => { vp.classList.remove("drag"); vp.removeEventListener("pointermove", mv); vp.removeEventListener("pointerup", up); };
    vp.addEventListener("pointermove", mv); vp.addEventListener("pointerup", up);
  });
  vp.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * .0025), e.clientX, e.clientY); return; }
    if (e.target.closest("textarea, .h8-note-text, .txt")) return;
    e.preventDefault(); view.x -= e.deltaX; view.y -= e.deltaY; apply();
  }, { passive: false });
  vp.addEventListener("dblclick", (e) => {
    if (blocked(e.target)) return;
    const r = world.getBoundingClientRect();
    const n = { id: H.uid(), x: (e.clientX - r.left) / view.z - 105, y: (e.clientY - r.top) / view.z - 20, text: "", author: H.st.me };
    (H.st.free = H.st.free || []).push(n); H.save(); drawFree(n).querySelector(".txt").focus();
  });
  document.getElementById("zi").onclick = () => zoomAt(1.2, innerWidth / 2, innerHeight / 2);
  document.getElementById("zo").onclick = () => zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
  document.getElementById("zf").onclick = () => fit(world);

  function drawChrome() {
    document.getElementById("tb").replaceChildren(H.toolbarEl("board.html"));
    const j = document.getElementById("jump"); j.innerHTML = "";
    H.clusters().forEach((c) => { const b = H.el(`<button style="--cc:${css(c)}" title="${H.esc(c.titel)}"><i></i>${c.kurz}</button>`); b.onclick = () => fit(document.getElementById("f-" + c.id)); j.appendChild(b); });
    const side = document.getElementById("side");
    side.innerHTML = `<h2>Agenda</h2>`; side.appendChild(H.agendaEl());
    side.appendChild(H.el(`<h2 style="margin-top:18px">Gesprächsergebnis</h2>`)); side.appendChild(H.decisionsEl());
  }
  document.getElementById("toggleSide").onclick = (e) => {
    const s = document.getElementById("side"), open = s.style.display === "none";
    s.style.display = open ? "flex" : "none"; e.target.textContent = open ? "Beschlüsse & Agenda ◂" : "Beschlüsse & Agenda ▸";
  };
  H.onAgenda = (g) => { const f = document.getElementById("f-" + g.cluster); if (f) fit(f); else if (document.getElementById("side").style.display === "none") document.getElementById("toggleSide").click(); };
  function all() { drawWorld(); drawChrome(); }
  H.onChange(all); all(); apply();
  if (!sessionStorage.getItem(VIEW + "-seen")) { sessionStorage.setItem(VIEW + "-seen", 1); requestAnimationFrame(() => fit(world)); }
})();
</script>
</body>
</html>
